name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:       eu-central-1
  ECR_BACKEND:      489287384619.dkr.ecr.eu-central-1.amazonaws.com/cs3-dev-backend
  ECR_FRONTEND:     489287384619.dkr.ecr.eu-central-1.amazonaws.com/cs3-dev-frontend
  EKS_CLUSTER:      cs3-dev-cluster

jobs:
  # ── JOB 1: Run Tests ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cs3-portal/backend/package-lock.json

      - name: Install dependencies
        working-directory: cs3-portal/backend
        run: npm ci

      - name: Run unit tests
        working-directory: cs3-portal/backend
        run: npm test -- --testPathPattern=unit
        env:
          JWT_SECRET: test_secret
          NODE_ENV: test

      - name: Run integration tests
        working-directory: cs3-portal/backend
        run: npm test -- --testPathPattern=integration
        env:
          JWT_SECRET: test_secret
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: cs3-portal/backend/junit.xml
          if-no-files-found: ignore

  # ── JOB 2: Build & Push to ECR (only if tests pass, only on main) ───────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::489287384619:role/cs3-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        working-directory: cs3-portal/backend
        run: |
          docker build -t $ECR_BACKEND:latest -t $ECR_BACKEND:${{ github.sha }} .
          docker push $ECR_BACKEND:latest
          docker push $ECR_BACKEND:${{ github.sha }}

      - name: Build & push frontend
        working-directory: cs3-portal/frontend
        run: |
          docker build -t $ECR_FRONTEND:latest -t $ECR_FRONTEND:${{ github.sha }} .
          docker push $ECR_FRONTEND:latest
          docker push $ECR_FRONTEND:${{ github.sha }}

  # ── JOB 3: Deploy to EKS (only if build passes) ─────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::489287384619:role/cs3-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Deploy backend
        run: |
          kubectl set image deployment/backend backend=$ECR_BACKEND:${{ github.sha }}
          kubectl rollout status deployment/backend --timeout=120s

      - name: Deploy frontend
        run: |
          kubectl set image deployment/frontend frontend=$ECR_FRONTEND:${{ github.sha }}
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Verify deployment
        run: kubectl get pods
